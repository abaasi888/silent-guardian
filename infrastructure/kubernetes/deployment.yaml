apiVersion: apps/v1
kind: Deployment
metadata: { name: silent-guardian-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec: { containers: [ { name: backend, image: silentguardian/backend:latest, ports: [ { containerPort: 5000 } ] } ] }
