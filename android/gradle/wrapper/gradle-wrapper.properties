# Gradle Wrapper Configuration for Silent Guardian Android App
# This file defines the Gradle distribution to use and where to download it.

# Distribution base: GRADLE_USER_HOME (default ~/.gradle) or project directory
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists

# Distribution URL – specifies the exact Gradle version
# Using Gradle 8.2 (compatible with Android Gradle Plugin 8.2.0)
distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip

# ZIP store base and path (where the wrapper stores the downloaded ZIP)
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# Optional: Network timeout (in milliseconds) for downloading the distribution
# distributionUrlTimeout=30000